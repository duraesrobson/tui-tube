<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#404040"/>
      <stop offset="50%" style="stop-color:#606060"/>
      <stop offset="100%" style="stop-color:#404040"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41"/>
      <stop offset="100%" style="stop-color:#00cc33"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>

  <!-- Tube/Pipe -->
  <rect x="156" y="120" width="200" height="280" rx="20" fill="url(#tubeGrad)" stroke="#505050" stroke-width="4"/>

  <!-- Tube rings -->
  <ellipse cx="256" cy="160" rx="90" ry="20" fill="none" stroke="#505050" stroke-width="4"/>
  <ellipse cx="256" cy="360" rx="90" ry="20" fill="none" stroke="#505050" stroke-width="4"/>

  <!-- Download arrow -->
  <path d="M256 200 L256 340 M220 300 L256 340 L292 300" 
        stroke="url(#arrowGrad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none"/>

  <!-- Arrow head glow effect -->
  <path d="M256 200 L256 340 M220 300 L256 340 L292 300" 
        stroke="#00ff41" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"
        opacity="0.3"
        filter="url(#glow)"/>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>